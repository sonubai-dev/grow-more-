<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle glow -->
  <circle cx="600" cy="240" r="300" fill="#4f46e5" opacity="0.18" filter="blur(60px)" />

  <!-- Logo Container -->
  <rect x="540" y="100" width="120" height="120" rx="32" fill="url(#primary)" />
  <!-- Sparkle Icon -->
  <path d="M600 135L608 158L630 165L608 172L600 195L592 172L570 165L592 158L600 135Z" fill="#ffffff" />
  <path d="M624 135L627 144L636 147L627 150L624 159L621 150L612 147L621 144L624 135Z" fill="#c7d2fe" />

  <!-- Product Name -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Zellon<tspan fill="#818cf8">AI</tspan>
  </text>

  <!-- Subtitle / Value Proposition -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">
    Customer Feedback &amp; Google Review Management
  </text>

  <text x="600" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Capture private resolution feedback and route happy 5-star customers directly to Google.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(320, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="85" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⚡ Smart Routing</text>

    <!-- Pill 2 -->
    <rect x="190" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="280" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#34d399">⭐ 5-Star Acceleration</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="475" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#a78bfa">🔒 Multi-Tenant Auth</text>
  </g>

  <!-- Domain Badge -->
  <text x="600" y="550" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#64748b">
    https://zellonai.online
  </text>
